<!DOCTYPE html>
<html lang="en">
<head>

    header {

      color: white;
      text-align: center;
      padding: 60px 20px 50px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #f0e6d2;
    }

    header p {
      font-size: 1.15rem;
      opacity: 0.85;

      color: #d6d0c4;

    .container {

      margin: 0 auto;

    .intro, .booking, .stop {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      margin-bottom: 30px;
      border: 1px solid #2a2a2a;
    }

    .intro h2, .booking h2, .stop h3 {
      color: #e8d5a3;
      margin-bottom: 15px;
      font-size: 1.5rem;
    }

    .intro p {
      margin-bottom: 16px;
      color: #d1cdc7;
    }

    .intro p:last-child {
      margin-bottom: 0;
    }

    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 40px;
    }

    .photos img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .stop {
      border-left: 5px solid #c9a227;
      padding: 25px;
    }

    .stop h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .stop .meta {
      font-size: 0.9rem;
      color: #a8a29e;
      margin-bottom: 12px;
    }

    .stop p {
      color: #d1cdc7;
    }

    .stop a {
      color: #e8d5a3;
      text-decoration: underline;
    }

    .schedule {
      margin: 20px 0;
      padding-left: 5px;
    }

    .schedule p {
      margin-bottom: 8px;
      color: #d1cdc7;
    }
